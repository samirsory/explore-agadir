let lang='en',days=3;const $=id=>document.getElementById(id);function el(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function cards(id,items,isPlace=false){const root=$(id);root.replaceChildren();items.forEach(item=>{const c=el('article','card');if(isPlace)c.dataset.search=item.slice(0,3).join(' ').toLocaleLowerCase();c.append(el('div','emoji',item[1]));c.append(el('h3','',item[0]));c.append(el('p','',item[2]));if(isPlace){const a=el('a','btn',T[lang].map);a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(item[3]);a.target='_blank';a.rel='noopener noreferrer';c.append(a)}root.append(c)})}function updatePlan(){const t=T[lang];$('planHeading').textContent=days+' '+t.days;const root=$('planSteps');root.replaceChildren();t.plans[days].forEach((step,i)=>root.append(el('li','',t.day+' '+(i+1)+': '+step)));document.querySelectorAll('[data-days]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.days)===days);b.setAttribute('aria-pressed',String(Number(b.dataset.days)===days))})}function filter(){const q=$('search').value.trim().toLocaleLowerCase();let count=0;document.querySelectorAll('#destGrid .card').forEach(c=>{const ok=c.dataset.search.includes(q);c.classList.toggle('hidden',!ok);if(ok)count++});$('empty').classList.toggle('hidden',count!==0)}function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';const t=T[l];document.querySelectorAll('[data-t]').forEach(n=>n.textContent=t[n.dataset.t]);$('search').placeholder=t.search;$('search').setAttribute('aria-label',t.search);cards('destGrid',t.places,true);cards('actGrid',t.activities);cards('stayGrid',t.stays);cards('foodGrid',t.foods);cards('transportGrid',t.transport);cards('tipsGrid',t.tips);updatePlan();filter();document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===l);b.setAttribute('aria-pressed',String(b.dataset.lang===l))})}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));document.querySelectorAll('[data-days]').forEach(b=>b.addEventListener('click',()=>{days=Number(b.dataset.days);updatePlan()}));$('search').addEventListener('input',filter);setLang('en');
</script></body></html>
